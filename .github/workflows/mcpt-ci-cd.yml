name: MCPT CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "ai_service/**"
      - "infra/**"
      - "shared_secret_runtime.py"
      - ".github/workflows/mcpt-ci-cd.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker stack
        run: docker compose -f infra/docker-compose.yml --env-file infra/env/backend.env build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend,frontend,ai_service,infra,shared_secret_runtime.py"
          target: ${{ secrets.VPS_APP_DIR }}
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            sed -i 's/\r$//' infra/vps/deploy.sh 2>/dev/null || true
            chmod +x infra/vps/deploy.sh
            ./infra/vps/deploy.sh "$(pwd)"
