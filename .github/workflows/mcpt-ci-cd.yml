name: MCPT CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Multi-Camera-Person-Tracking-and-Re-Identification/**"
      - ".github/workflows/mcpt-ci-cd.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Multi-Camera-Person-Tracking-and-Re-Identification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker stack
        run: docker compose build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "Multi-Camera-Person-Tracking-and-Re-Identification"
          target: ${{ secrets.VPS_APP_DIR }}
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd "${{ secrets.VPS_APP_DIR }}/Multi-Camera-Person-Tracking-and-Re-Identification"
            chmod +x infra/vps/deploy.sh
            ./infra/vps/deploy.sh "$(pwd)"
