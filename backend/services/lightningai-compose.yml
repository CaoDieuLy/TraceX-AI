# Docker Compose for TraceX-AI — LightningAI A100 80GB deployment
#
# VRAM allocation (80GB total):
#   metadata-service : ~50GB — Grounding DINO 1.6 + EVA-02 + SigLIP 2 + VideoMAE V2 (ingest GPU)
#   query-service   : ~15GB — SeamlessM4T v2 + SigLIP 2 text tower (search GPU)
#   trace-service   : ~15GB — Neural video reconstruction + FFmpeg NVENC (trace GPU)
#
# Infrastructure:
#   Coolify VPS → frontend (3000) + postgres (5432)
#   LightningAI → metadata-service (8002) + query-service (8003) + trace-service (8004)
#
# Usage:
#   docker compose -f backend/services/lightningai-compose.yml up -d
#
# Requires:
#   - .env file with POSTGRES_HOST, POSTGRES_PASSWORD, JWT_SECRET_KEY
#   - /workspace/models/         — SOTA 2026 model weights cache
#   - /workspace/datasets/       — MTMC 2024 ground truth (Step 0b)

services:
  # ────────────────────────────────────────────────────────────────────
  # postgres — shared database (same server as GPU services)
  # ────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tracex-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-video_tracking}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpt_user} -d ${POSTGRES_DB:-video_tracking}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - coolify

  # ────────────────────────────────────────────────────────────────────
  # frontend — Next.js UI (public via Traefik)
  # ────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api/v1
    container_name: tracex-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - COOLIFY_DEPLOYMENT=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.tracex-frontend-https.rule=Host(`tracex-ai.smartnovi.tech`)
      - traefik.http.routers.tracex-frontend-https.entrypoints=https
      - traefik.http.routers.tracex-frontend-https.tls=true
      - traefik.http.routers.tracex-frontend-https.tls.certresolver=letsencrypt
      - traefik.http.services.tracex-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.tracex-frontend-http.rule=Host(`tracex-ai.smartnovi.tech`)
      - traefik.http.routers.tracex-frontend-http.entrypoints=http
      - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.permanent=true
      - traefik.http.routers.tracex-frontend-http.middlewares=tracex-frontend-redirect@docker

  # ────────────────────────────────────────────────────────────────────
  # metadata-service — GPU Ingest (~50GB VRAM)
  # Grounding DINO 1.6 + EVA-02 ViT-L/14 + SigLIP 2 + VideoMAE V2
  # ────────────────────────────────────────────────────────────────────
  metadata-service:
    build:
      context: ../..
      dockerfile: backend/services/metadata-service/Dockerfile
    container_name: tracex-metadata-service
    image: tracex/metadata-service:latest
    ports:
      - "8002:8002"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-video_tracking}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-mcpt_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_tracking}
      - QUERY_SERVICE_URL=http://query-service:8003
      - TRACE_SERVICE_URL=http://trace-service:8004
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@mcpt.local}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      - BOOTSTRAP_ADMIN_FULL_NAME=${BOOTSTRAP_ADMIN_FULL_NAME:-Administrator}
      - TRACKING_REQUEST_TIMEOUT_SECONDS=${TRACKING_REQUEST_TIMEOUT_SECONDS:-600}
      - TRACKING_HEALTH_TIMEOUT_SECONDS=${TRACKING_HEALTH_TIMEOUT_SECONDS:-10}
      - TRACKING_STARTUP_MAX_WAIT_SECONDS=${TRACKING_STARTUP_MAX_WAIT_SECONDS:-120}
      - TRACKING_STARTUP_POLL_INTERVAL_SECONDS=${TRACKING_STARTUP_POLL_INTERVAL_SECONDS:-10}
      - TRACKING_STARTUP_RETRY_ATTEMPTS=${TRACKING_STARTUP_RETRY_ATTEMPTS:-3}
      - STORAGE_INGEST_ENABLED=${STORAGE_INGEST_ENABLED:-false}
      - STORAGE_INGEST_ROOT=${STORAGE_INGEST_ROOT:-/workspace/storage}
      - VIDEO_STORAGE_ROOT=${VIDEO_STORAGE_ROOT:-/workspace/storage/videos}
      - TRACKING_OUTPUT_ROOT=${TRACKING_OUTPUT_ROOT:-/workspace/storage/tracking-output}
      - GOOGLE_DRIVE_ENABLED=${GOOGLE_DRIVE_ENABLED:-false}
      - MCPT_SECRETS_ROOT=${MCPT_SECRETS_ROOT:-/workspace/secrets}
      - CAMERA_CALIBRATION_PATH=/workspace/a20-root/config/calibration_2025_format.json
      - MTMC_GT_ROOT=/workspace/datasets/MTMC_Tracking_2024/train
      - STARTUP_LOCAL_QUEUE_SYNC_ENABLED=false
      - LOCAL_QUEUE_CACHE_ENABLED=false
      - A20_ROOT=${A20_ROOT:-/workspace/a20-root}
      # GPU model paths
      - HF_HOME=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - TRANSFORMERS_OFFLINE=1
      - MAX_VIDEO_FRAMES=500
    volumes:
      - mcpt_storage:/workspace/storage
      - model_weights:/workspace/models
      - mtmc_gt:/workspace/datasets/MTMC_Tracking_2024/train:ro
      - a20_root:/workspace/a20-root:ro
      - /workspace/secrets:/workspace/secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                NVIDIA_VISIBLE_DEVICES: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.tracex-metadata-strip.stripprefix.prefixes=/api
      - traefik.http.routers.tracex-metadata-https.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/api`)
      - traefik.http.routers.tracex-metadata-https.entrypoints=https
      - traefik.http.routers.tracex-metadata-https.tls=true
      - traefik.http.routers.tracex-metadata-https.tls.certresolver=letsencrypt
      - traefik.http.routers.tracex-metadata-https.middlewares=tracex-metadata-strip@docker
      - traefik.http.services.tracex-metadata.loadbalancer.server.port=8002
      - traefik.http.routers.tracex-metadata-http.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/api`)
      - traefik.http.routers.tracex-metadata-http.entrypoints=http
      - traefik.http.middlewares.tracex-metadata-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.tracex-metadata-redirect.redirectscheme.permanent=true
      - traefik.http.routers.tracex-metadata-http.middlewares=tracex-metadata-redirect@docker
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────
  # query-service — Search & Translation (~15GB VRAM)
  # SeamlessM4T v2-large + SigLIP 2 text tower
  # ────────────────────────────────────────────────────────────────────
  query-service:
    build:
      context: ../..
      dockerfile: backend/services/query-service/Dockerfile
    container_name: tracex-query-service
    image: tracex/query-service:latest
    ports:
      - "8003:8003"
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-video_tracking}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-mcpt_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_tracking}
      - METADATA_SERVICE_URL=http://metadata-service:8002
      - TRACE_SERVICE_URL=http://trace-service:8004
      - TRACKING_SERVICE_URL=http://trace-service:8004
      - SEAMLESS_M4T_MODEL=${SEAMLESS_M4T_MODEL:-facebook/seamless-m4t-v2-large}
      - TRANSLATION_MODEL_PATH=/workspace/models/seamless-m4t
      - PREVIEW_ROOT=/workspace/storage/candidate-previews
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - TRACKING_REQUEST_TIMEOUT_SECONDS=${TRACKING_REQUEST_TIMEOUT_SECONDS:-120}
      - HF_HOME=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - mcpt_storage:/workspace/storage
      - model_weights:/workspace/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                NVIDIA_VISIBLE_DEVICES: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.tracex-query-strip.stripprefix.prefixes=/query
      - traefik.http.routers.tracex-query-https.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/query`)
      - traefik.http.routers.tracex-query-https.entrypoints=https
      - traefik.http.routers.tracex-query-https.tls=true
      - traefik.http.routers.tracex-query-https.tls.certresolver=letsencrypt
      - traefik.http.routers.tracex-query-https.middlewares=tracex-query-strip@docker
      - traefik.http.services.tracex-query.loadbalancer.server.port=8003
      - traefik.http.routers.tracex-query-http.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/query`)
      - traefik.http.routers.tracex-query-http.entrypoints=http
      - traefik.http.middlewares.tracex-query-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.tracex-query-redirect.redirectscheme.permanent=true
      - traefik.http.routers.tracex-query-http.middlewares=tracex-query-redirect@docker
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────
  # trace-service — Neural Video Reconstruction (~15GB VRAM)
  # Real-ESRGAN + ProPainter + RIFE + NVENC
  # ────────────────────────────────────────────────────────────────────
  trace-service:
    build:
      context: ../..
      dockerfile: backend/services/trace-service/Dockerfile
    container_name: tracex-trace-service
    image: tracex/trace-service:latest
    ports:
      - "8004:8004"
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-video_tracking}
      - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-mcpt_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-video_tracking}
      - VIDEO_STORAGE_PATH=/workspace/storage/videos
      - TRACE_OUTPUT_PATH=/workspace/storage/traces
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-}
      - MAX_TRACE_WINDOW_HOURS=${MAX_TRACE_WINDOW_HOURS:-24}
      - DEFAULT_TRACE_WINDOW_HOURS=${DEFAULT_TRACE_WINDOW_HOURS:-24}
      - VIDEO_MERGE_ENABLED=${VIDEO_MERGE_ENABLED:-true}
      - MAX_SEGMENTS_PER_TRACE=${MAX_SEGMENTS_PER_TRACE:-50}
      - EVIDENCE_CACHE_MAX_QUERIES=${EVIDENCE_CACHE_MAX_QUERIES:-5}
      - CAMERA_CALIBRATION_PATH=/workspace/a20-root/config/calibration_2025_format.json
      - MTMC_GT_ROOT=/workspace/datasets/MTMC_Tracking_2024/train
      - A20_ROOT=${A20_ROOT:-/workspace/a20-root}
      # Neural video processing
      - TRACE_CACHE_ROOT=/workspace/storage/cache
      - REALESRGAN_MODEL_PATH=/workspace/models/realesrgan
      - PROPAINTER_MODEL_PATH=/workspace/models/propaint
      - RIFE_MODEL_PATH=/workspace/models/rife
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - mcpt_storage:/workspace/storage
      - model_weights:/workspace/models
      - mtmc_gt:/workspace/datasets/MTMC_Tracking_2024/train:ro
      - a20_root:/workspace/a20-root:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              options:
                NVIDIA_VISIBLE_DEVICES: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.tracex-trace-strip.stripprefix.prefixes=/trace
      - traefik.http.routers.tracex-trace-https.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/trace`)
      - traefik.http.routers.tracex-trace-https.entrypoints=https
      - traefik.http.routers.tracex-trace-https.tls=true
      - traefik.http.routers.tracex-trace-https.tls.certresolver=letsencrypt
      - traefik.http.routers.tracex-trace-https.middlewares=tracex-trace-strip@docker
      - traefik.http.services.tracex-trace.loadbalancer.server.port=8004
      - traefik.http.routers.tracex-trace-http.rule=Host(`tracex-ai.smartnovi.tech`) && PathPrefix(`/trace`)
      - traefik.http.routers.tracex-trace-http.entrypoints=http
      - traefik.http.middlewares.tracex-trace-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.tracex-trace-redirect.redirectscheme.permanent=true
      - traefik.http.routers.tracex-trace-http.middlewares=tracex-trace-redirect@docker

# ────────────────────────────────────────────────────────────────────
# Named volumes
# ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  mcpt_storage:
    driver: local
  model_weights:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /workspace/models
  mtmc_gt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /workspace/datasets/MTMC_Tracking_2024/train
  a20_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /workspace/a20-root

networks:
  coolify:
    external: true
