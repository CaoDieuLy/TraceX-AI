# Docker Compose for TraceX-AI on Coolify
# Frontend + Postgres only — backend services run on LightningAI
#
# Usage: docker-compose -f docker-compose.yml up -d
#
# IMPORTANT: Set NEXT_PUBLIC_API_BASE_URL env var to LightningAI URL:
#   NEXT_PUBLIC_API_BASE_URL=https://8000-01kqhxrsmzj0gjh7fe5fqga4jm.cloudspaces.litng.ai/api/v1

services:
    postgres:
      image: postgres:16-alpine
      container_name: mcpt-postgres
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-video_tracking}
        - POSTGRES_USER=${POSTGRES_USER:-mcpt_user}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Mcpt@2026Secure}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 10
      restart: unless-stopped
      networks:
        - coolify

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          # Override at build time if needed
          - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
      container_name: mcpt-frontend
      expose:
        - "3000"
      restart: unless-stopped
      environment:
        - NODE_ENV=production
        # Points to LightningAI metadata-service public URL
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://8000-01kqhxrsmzj0gjh7fe5fqga4jm.cloudspaces.litng.ai/api/v1}
        - COOLIFY_DEPLOYMENT=true
      healthcheck:
        test: ["CMD", "curl", "-s", "http://localhost:3000"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      labels:
        - traefik.enable=true
        - traefik.docker.network=coolify
        - traefik.http.routers.TraceX-frontend-https.rule=Host(`tracex-ai.smartnovi.tech`)
        - traefik.http.routers.TraceX-frontend-https.entrypoints=https
        - traefik.http.routers.TraceX-frontend-https.tls=true
        - traefik.http.routers.TraceX-frontend-https.tls.certresolver=letsencrypt
        - traefik.http.services.TraceX-frontend.loadbalancer.server.port=3000
        - traefik.http.routers.TraceX-frontend-http.rule=Host(`tracex-ai.smartnovi.tech`)
        - traefik.http.routers.TraceX-frontend-http.entrypoints=http
        - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.tracex-frontend-redirect.redirectscheme.permanent=true
        - traefik.http.routers.TraceX-frontend-http.middlewares=tracex-frontend-redirect@docker
      networks:
        - coolify

volumes:
  postgres_data:

networks:
  coolify:
    external: true
