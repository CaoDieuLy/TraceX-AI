# Modular stack: frontend, backend (gateway + metadata), ai_service, postgres.
# Run from repo root: docker compose -f infra/docker-compose.yml --env-file infra/env/backend.env up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: mcpt-postgres
    env_file:
      - ./env/backend.env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-video_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-mcpt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ai_service
    container_name: mcpt-ai-service
    env_file:
      - ./env/ai.env
    ports:
      - "${AI_SERVICE_BIND_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../secrets:/workspace/a20-root/secrets:ro
      - ../secret:/workspace/a20-root/secret:ro
      - mcpt_storage:/workspace/storage

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: mcpt-backend
    env_file:
      - ./env/backend.env
    ports:
      - "${BACKEND_BIND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_started
    volumes:
      - ../secrets:/workspace/a20-root/secrets:ro
      - ../secret:/workspace/a20-root/secret:ro
      - mcpt_storage:/workspace/storage

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mcpt-frontend
    env_file:
      - ./env/frontend.env
    ports:
      - "${FRONTEND_BIND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mcpt_storage:
